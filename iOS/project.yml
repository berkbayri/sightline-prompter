# Generates SightlinePrompter.xcodeproj (gitignored). Run `xcodegen generate` in this folder.
# The app uses the root Swift package for the shared Core and Aligner modules.
name: SightlinePrompter
options:
  bundleIdPrefix: com.berkbayri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Sightline:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "7"
    ENABLE_PREVIEWS: NO

targets:
  SightlinePrompter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Sightline
        product: SightlineCore
      - package: Sightline
        product: Aligner
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.video
        NSUbiquitousContainers:
          iCloud.com.berkbayri.SightlinePrompter:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Sightline Prompter
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSMicrophoneUsageDescription: The microphone is used to follow your speech and scroll the script automatically.
        NSSpeechRecognitionUsageDescription: Speech recognition is used to find the word you are reading. Audio is processed on device when possible.
        NSCameraUsageDescription: The camera records your video while you read the script, and measures how far you sit from the screen so the text stays readable. Nothing is saved or sent except your recording.
        NSPhotoLibraryAddUsageDescription: Recordings are saved to your Photos library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkbayri.SightlinePrompter
        PRODUCT_NAME: SightlinePrompter
        APP_DISPLAY_NAME: Sightline Prompter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
      configs:
        # The iCloud container needs a paid developer team: a personal team cannot sign it. Release builds
        # (App Store, TestFlight) carry the entitlement; Debug builds on a personal team run without it and use
        # the folder chosen in Settings instead.
        Release:
          CODE_SIGN_ENTITLEMENTS: Support/SightlinePrompter.entitlements
        # Debug builds are a separate app on the phone, so a test build never replaces the App Store install:
        # own bundle id, own name, own icon with a DEV ribbon.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.berkbayri.SightlinePrompter.dev
          APP_DISPLAY_NAME: Sightline DEV
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev

  SightlinePrompterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SightlinePrompter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkbayri.SightlinePrompter.UITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # XCUITest drives the app from outside it; no unit-test style loader is needed.
        BUNDLE_LOADER: ""
        TEST_HOST: ""

schemes:
  SightlinePrompter:
    build:
      targets:
        SightlinePrompter: all
    run:
      config: Debug
      storeKitConfiguration: Sightline.storekit
    test:
      targets:
        - SightlinePrompterUITests
