# Generates SightlinePrompter.xcodeproj (gitignored). Run `xcodegen generate` in this folder.
# The app uses the root Swift package for the shared Core and Aligner modules.
name: SightlinePrompter
options:
  bundleIdPrefix: com.berkbayri
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Sightline:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: NO

targets:
  SightlinePrompter:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: Sightline
        product: SightlineCore
      - package: Sightline
        product: Aligner
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sightline Prompter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.video
        NSMicrophoneUsageDescription: The microphone is used to follow your speech and scroll the script automatically.
        NSSpeechRecognitionUsageDescription: Speech recognition is used to find the word you are reading. Audio is processed on device when possible.
        NSCameraUsageDescription: The camera records your video while you read the script.
        NSPhotoLibraryAddUsageDescription: Recordings are saved to your Photos library.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkbayri.SightlinePrompter
        PRODUCT_NAME: SightlinePrompter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        INFOPLIST_KEY_UILaunchScreen_Generation: NO

  SightlinePrompterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SightlinePrompter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.berkbayri.SightlinePrompter.UITests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # XCUITest drives the app from outside it; no unit-test style loader is needed.
        BUNDLE_LOADER: ""
        TEST_HOST: ""

schemes:
  SightlinePrompter:
    build:
      targets:
        SightlinePrompter: all
    run:
      config: Debug
      storeKitConfiguration: Sightline.storekit
    test:
      targets:
        - SightlinePrompterUITests
