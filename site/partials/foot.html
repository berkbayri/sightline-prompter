<footer class="foot">
  <div class="wrap foot-in">
    <a class="brand" href="{{home}}"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Sightline Prompter</a>
    <ul>
      <li><a href="/privacy.html">{{footer.privacy}}</a></li>
      <li><a href="/terms.html">{{footer.terms}}</a></li>
      <li><a href="/support.html">{{footer.support}}</a></li>
      {{#analytics}}<li><button type="button" id="cookie-settings">{{consent.settings}}</button></li>{{/analytics}}
    </ul>
    <ul class="foot-langs" aria-label="{{nav.language_menu}}">
      {{#switcher}}<li><a href="{{path}}" hreflang="{{lang}}" lang="{{lang}}" data-lang="{{code}}">{{name}}</a></li>
      {{/switcher}}
    </ul>
    <p>&copy; {{year}} Sightline Prompter. {{footer.rights}}</p>
    <p class="legal">{{footer.legal}}</p>
  </div>
</footer>

{{#analytics}}<div class="consent" id="consent" role="region" aria-label="{{consent.settings}}" hidden>
  <p>{{consent.text}}</p>
  <div class="consent-btns">
    <button type="button" class="btn sm ghost" data-c="granted">{{consent.accept}}</button>
    <button type="button" class="btn sm ghost" data-c="denied">{{consent.decline}}</button>
  </div>
</div>{{/analytics}}
